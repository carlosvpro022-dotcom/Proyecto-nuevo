[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/capture",
    "crates/clipboard",
    "crates/input",
    "crates/keyvault",
    "crates/power",
    "crates/transport",
    "crates/security",
    "crates/file-transfer",
    "crates/audio",
    "server/signaling",
    "apps/windows-host/src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Proprietary"
authors = ["NEXUS REMOTE"]
repository = "https://github.com/carlosvpro022-dotcom/Proyecto-nuevo"
publish = false

[workspace.dependencies]
# --- crates internos ---
nexus-core = { path = "crates/core" }
nexus-security = { path = "crates/security" }
nexus-transport = { path = "crates/transport" }
nexus-capture = { path = "crates/capture" }
nexus-clipboard = { path = "crates/clipboard" }
nexus-input = { path = "crates/input" }
nexus-keyvault = { path = "crates/keyvault" }
nexus-power = { path = "crates/power" }
nexus-audio = { path = "crates/audio" }
nexus-file-transfer = { path = "crates/file-transfer" }

# Politica de lints comun a todo el workspace.
#
# `clippy::pedantic` esta activo a proposito: este codigo maneja criptografia y
# red, y conviene que el compilador sea exigente. Lo que se desactiva, se
# desactiva aqui una sola vez y con su motivo.
[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Casi todo son getters puros; marcar cada uno con #[must_use] solo anade ruido.
must_use_candidate = "allow"
# `session::SessionState` se reexporta en la raiz, donde el nombre completo si aporta.
module_name_repetitions = "allow"
# Las conversiones numericas estan acotadas en origen (resoluciones de pantalla,
# milisegundos de una ventana de segundos) y comentadas en el punto de uso.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Las duraciones se expresan en la unidad que hace legible la relacion entre
# ellas: una progresion 500/1000/2000 ms se lee mejor toda en milisegundos.
duration_suboptimal_units = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
# Solo tablas de lineas, no la informacion de depuracion completa.
#
# Lo que se usa aqui de verdad es el `file:line` de un panico, y eso lo dan las
# tablas de lineas. La informacion completa (tipos, variables locales) solo le
# sirve a un depurador conectado, que en este proyecto no se usa, y multiplica
# por varias veces el tamano de cada binario de prueba: con webrtc y Tauri
# dentro, cada uno pasaba de 370 MB y llenaban el disco a mitad de sesion.
debug = "line-tables-only"

# El perfil que usa Tauri para los binarios distribuibles.
[profile.dist]
inherits = "release"
debug = false
